name: Release to PyPI

# Push a tag that matches the version in pyproject.toml to release it:
#   git tag v1.1.0 && git push origin v1.1.0
# Run it by hand with dry_run (the default) to build and check without
# publishing. Needs the PYPI_API_TOKEN repository secret.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; don't publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match version ${VERSION}"; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: env.DRY_RUN != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          test -n "$TWINE_PASSWORD" || { echo "Add the PYPI_API_TOKEN repository secret first."; exit 1; }
          twine upload dist/*
